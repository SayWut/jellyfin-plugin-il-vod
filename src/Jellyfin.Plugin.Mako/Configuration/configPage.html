<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mako</title>
</head>
<body>
<div id="MakoConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button">
    <div data-role="content">
        <div class="content-primary">
            <form id="MakoConfigForm">
                <div class="verticalSection">
                    <h2 class="sectionTitle">Mako</h2>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="PinnedShowPath">Pinned show path</label>
                        <input id="PinnedShowPath" name="PinnedShowPath" type="text" is="emby-input" />
                        <div class="fieldDescription">
                            mako's own page path for the show this channel shows, e.g.
                            <code>/mako-vod-keshet/shemesh</code>.
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="PinnedShowName">Pinned show name</label>
                        <input id="PinnedShowName" name="PinnedShowName" type="text" is="emby-input" />
                        <div class="fieldDescription">
                            The name shown for the show. mako's own show page carries no reliable title.
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="AppVersion">App version</label>
                        <input id="AppVersion" name="AppVersion" type="text" is="emby-input" />
                        <div class="fieldDescription">
                            The app version reported to mako, matching what mako's own Android app sends.
                        </div>
                    </div>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var MakoConfig = { pluginUniqueId: '1b35ed7d-7558-4592-aa1a-681b9d67d305' };

        document.querySelector('#MakoConfigPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(MakoConfig.pluginUniqueId).then(function (config) {
                document.querySelector('#PinnedShowPath').value = config.PinnedShowPath || '';
                document.querySelector('#PinnedShowName').value = config.PinnedShowName || '';
                document.querySelector('#AppVersion').value = config.AppVersion || '';
                Dashboard.hideLoadingMsg();
            });
        });

        document.querySelector('#MakoConfigForm').addEventListener('submit', function (event) {
            event.preventDefault();
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(MakoConfig.pluginUniqueId).then(function (config) {
                config.PinnedShowPath = document.querySelector('#PinnedShowPath').value.trim();
                config.PinnedShowName = document.querySelector('#PinnedShowName').value.trim();
                config.AppVersion = document.querySelector('#AppVersion').value.trim();
                ApiClient.updatePluginConfiguration(MakoConfig.pluginUniqueId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                });
            });
            return false;
        });
    </script>
</div>
</body>
</html>
