<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IL-VOD</title>
</head>
<body>
<div id="IlVodConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button">
    <div data-role="content">
        <div class="content-primary">
            <form id="IlVodConfigForm">
                <div class="verticalSection">
                    <h2 class="sectionTitle">Mako</h2>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="CatalogueCacheHours">Catalogue cache (hours)</label>
                        <input id="CatalogueCacheHours" name="CatalogueCacheHours" type="number" min="1" is="emby-input" />
                        <div class="fieldDescription">
                            How long the genre lists are kept before mako is asked again. Opening the channel with a
                            cold cache costs six requests, paced.
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="AppVersion">App version</label>
                        <input id="AppVersion" name="AppVersion" type="text" is="emby-input" />
                        <div class="fieldDescription">
                            The app version reported to mako, matching what mako's own Android app sends.
                        </div>
                    </div>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        var IlVodConfig = { pluginUniqueId: 'b8239c51-1963-42d7-82ee-d98ce3e75db4' };

        document.querySelector('#IlVodConfigPage').addEventListener('pageshow', function () {
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(IlVodConfig.pluginUniqueId).then(function (config) {
                document.querySelector('#CatalogueCacheHours').value = config.CatalogueCacheHours;
                document.querySelector('#AppVersion').value = config.AppVersion || '';
                Dashboard.hideLoadingMsg();
            });
        });

        document.querySelector('#IlVodConfigForm').addEventListener('submit', function (event) {
            event.preventDefault();
            Dashboard.showLoadingMsg();
            ApiClient.getPluginConfiguration(IlVodConfig.pluginUniqueId).then(function (config) {
                config.CatalogueCacheHours = parseInt(document.querySelector('#CatalogueCacheHours').value, 10);
                config.AppVersion = document.querySelector('#AppVersion').value.trim();
                ApiClient.updatePluginConfiguration(IlVodConfig.pluginUniqueId, config).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                });
            });
            return false;
        });
    </script>
</div>
</body>
</html>
